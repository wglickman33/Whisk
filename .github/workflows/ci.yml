name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and test frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run build
